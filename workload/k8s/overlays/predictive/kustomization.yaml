apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: predictive

resources:
  - namespace.yaml
  - ../../base

labels:
  - pairs:
      prescale.io/side: predictive

patches:
  - target:
      kind: Service
      name: checkout
    patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: checkout
      spec:
        ports:
        - name: http
          port: 8080
          nodePort: 30082
  - target:
      kind: Service
      name: fakedb
    patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: fakedb
      spec:
        ports:
        - name: http
          port: 8080
          nodePort: 30084
