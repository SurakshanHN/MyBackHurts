apiVersion: apps/v1
kind: Deployment
metadata:
  name: fakedb
  namespace: demo
  labels:
    app: fakedb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fakedb
  template:
    metadata:
      labels:
        app: fakedb
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: fakedb
        image: prescale-demo/fakedb:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: MAX_CONNS
          value: "100"
        - name: MODE
          value: "contention"
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 128Mi
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 2
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 2
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: fakedb
  namespace: demo
  labels:
    app: fakedb
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8080
    targetPort: http
  selector:
    app: fakedb
