apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: checkout
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: checkout
  minReplicaCount: 3
  maxReplicaCount: 10
  pollingInterval: 5
  triggers:
  - type: cpu
    metricType: Utilization
    metadata:
      value: "50"
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 60
