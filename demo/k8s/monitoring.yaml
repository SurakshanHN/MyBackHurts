apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: prescale-demo-monitor
  namespace: demo
  labels:
    release: prometheus
spec:
  selector:
    matchExpressions:
    - key: app
      operator: In
      values: [fakedb, checkout]
  podMetricsEndpoints:
  - port: http
    path: /metrics
    interval: 5s
