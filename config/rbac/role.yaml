---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - autoscaling
  resources:
  - horizontalpodautoscalers
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - autoscaling.prescale.io
  resources:
  - scaledecisions
  - scaleguards
  verbs:
  - create
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - autoscaling.prescale.io
  resources:
  - scaledecisions/finalizers
  - scaleguards/finalizers
  verbs:
  - update
- apiGroups:
  - autoscaling.prescale.io
  resources:
  - scaledecisions/status
  - scaleguards/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - get
  - list
  - patch
  - update
  - watch
