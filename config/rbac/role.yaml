---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - autoscaling.prescale.io
  resources:
  - scaleguards
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - autoscaling.prescale.io
  resources:
  - scaleguards/finalizers
  verbs:
  - update
- apiGroups:
  - autoscaling.prescale.io
  resources:
  - scaleguards/status
  verbs:
  - get
  - patch
  - update
