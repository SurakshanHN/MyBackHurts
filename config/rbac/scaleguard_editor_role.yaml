# This rule is not used by the project prescale itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the autoscaling.prescale.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: prescale
    app.kubernetes.io/managed-by: kustomize
  name: scaleguard-editor-role
rules:
- apiGroups:
  - autoscaling.prescale.io
  resources:
  - scaleguards
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - autoscaling.prescale.io
  resources:
  - scaleguards/status
  verbs:
  - get
