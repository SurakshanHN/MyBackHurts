apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - keda-2.19.0.yaml

patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: keda-admission
      namespace: keda
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: keda-metrics-apiserver
      namespace: keda
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: keda-operator
      namespace: keda
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
