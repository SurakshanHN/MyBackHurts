apiVersion: v1
kind: ServiceAccount
metadata:
  name: vmsingle
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vmsingle
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - nodes/proxy
      - nodes/metrics
      - services
      - endpoints
      - pods
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics", "/metrics/cadvisor"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vmsingle
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vmsingle
subjects:
  - kind: ServiceAccount
    name: vmsingle
    namespace: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vmsingle-scrape-config
  namespace: monitoring
data:
  scrape.yml: |
    global:
      scrape_interval: 5s
      scrape_timeout: 4s

    scrape_configs:
      - job_name: victoriametrics
        static_configs:
          - targets: ["127.0.0.1:8428"]

      - job_name: kube-state-metrics
        static_configs:
          - targets: ["kube-state-metrics.monitoring.svc:8080"]

      - job_name: workload
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - baseline
                - predictive
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: replace
            target_label: app

      - job_name: cadvisor
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor
        metric_relabel_configs:
          - source_labels: [__name__]
            action: keep
            regex: (container_cpu_usage_seconds_total|container_cpu_cfs_throttled_periods_total)
          - source_labels: [namespace]
            action: keep
            regex: (baseline|predictive)
---
apiVersion: v1
kind: Service
metadata:
  name: vmsingle
  namespace: monitoring
  labels:
    app: vmsingle
spec:
  type: NodePort
  ports:
    - name: http
      port: 8428
      targetPort: 8428
      nodePort: 30428
  selector:
    app: vmsingle
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmsingle
  namespace: monitoring
  labels:
    app: vmsingle
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vmsingle
  template:
    metadata:
      labels:
        app: vmsingle
    spec:
      serviceAccountName: vmsingle
      containers:
        - name: victoria-metrics
          image: quay.io/victoriametrics/victoria-metrics:v1.115.0
          imagePullPolicy: IfNotPresent
          args:
            - -retentionPeriod=7d
            - -storageDataPath=/victoria-metrics-data
            - -search.latencyOffset=1s
            - -promscrape.config=/etc/victoria-metrics/scrape.yml
          ports:
            - name: http
              containerPort: 8428
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /victoria-metrics-data
            - name: config
              mountPath: /etc/victoria-metrics
      volumes:
        - name: data
          emptyDir: {}
        - name: config
          configMap:
            name: vmsingle-scrape-config
